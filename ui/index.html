<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0607" />
    <meta name="description" content="VANTAGE assessment console, served on this machine only." />
    <title>VANTAGE console</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 3l9 16H3z' fill='none' stroke='%23e5392c' stroke-width='2' stroke-linejoin='round'/%3E%3Ccircle cx='12' cy='14' r='2' fill='%23e5392c'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="topbar">
      <a class="brand" href="#/" translate="no">
        <span class="brand-dot" aria-hidden="true"></span>
        VANTAGE
      </a>
      <div class="topbar-actions">
        <span id="live" class="live" data-state="offline" role="status" aria-live="polite">Offline</span>
        <button id="token-button" class="btn btn--sm" type="button" aria-haspopup="dialog">Set token</button>
      </div>
    </header>

    <main id="main" class="app" tabindex="-1">
      <div id="view"><p class="loading">Loading…</p></div>
    </main>

    <footer class="footer">
      Served on 127.0.0.1 only. Every network action is recorded in the engagement’s audit log.
    </footer>

    <dialog id="drawer" class="drawer" aria-labelledby="drawer-title"></dialog>

    <dialog id="token-dialog" aria-labelledby="token-title">
      <form id="token-form" class="dialog-body" method="dialog">
        <h2 id="token-title">Operator token</h2>
        <p>Changing a finding’s status needs the token the server printed when it started. It stays in this tab only.</p>
        <label class="field" for="token-input">Token
          <input id="token-input" name="token" type="password" autocomplete="off" spellcheck="false" placeholder="Paste the token…" />
        </label>
        <div class="dialog-actions">
          <button id="token-clear" class="btn" type="button">Clear token</button>
          <button class="btn" type="button" data-close>Cancel</button>
          <button class="btn btn--primary" type="submit">Save token</button>
        </div>
      </form>
    </dialog>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
